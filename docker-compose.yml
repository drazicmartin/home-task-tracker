services:
  pb:
    build:
      context: pb/
    image: pocket-base:latest
    volumes:
      - db-data:/pb/pb_data
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
    expose:
      - "8090"
    restart: unless-stopped
    networks:
      - the-network

  grafana:
    image: grafana/grafana-oss
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ALLOW_EMBEDDING: true
    volumes:
      - grafana-storage:/var/lib/grafana
      - db-data:/data_from_pb_service
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - the-network

  sk:
    build: sk/
    image: htt-front:latest
    user: "node"
    depends_on:
      - pb
    environment:
      # Internal server error messages will not send stacktrace to the browser in production
      - NODE_ENV=production
      # Sets the timezone of the containers OS
      - TZ=Europe/Paris
      # Internal, service-to-service PocketBase URL (not the public one)
      - PB_URL=http://pb:8090
      # Public URL this app is served at — required by SvelteKit for CSRF checks
      - ORIGIN=${ORIGIN}
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - the-network

volumes:
  db-data:
  grafana-storage:

networks:
  the-network:
