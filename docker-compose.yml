services:
  pb:
    build:
      context: pb/
    image: pocket-base:latest
    volumes:
      - db-data:/pb/pb_data
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
      # Optional: "Continue with Authentik" login — leave unset to disable it.
      # See pb/pb_hooks/main.pb.js. AUTHENTIK_ISSUER is your Authentik instance's
      # base URL (e.g. https://auth.example.com), not the app-specific slug URL.
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
    expose:
      - "8090"
    restart: unless-stopped
    networks:
      - the-network

  grafana:
    image: grafana/grafana-oss
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ALLOW_EMBEDDING: true
    volumes:
      - grafana-storage:/var/lib/grafana
      - db-data:/data_from_pb_service
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - the-network

  sk:
    build: sk/
    image: htt-front:latest
    user: "node"
    depends_on:
      - pb
    environment:
      # Internal server error messages will not send stacktrace to the browser in production
      - NODE_ENV=production
      # Sets the timezone of the containers OS
      - TZ=Europe/Paris
      # Internal, service-to-service PocketBase URL (not the public one)
      - PB_URL=http://pb:8090
      # Public URL of the "pb" service, reachable from the user's browser —
      # needed for the Authentik OAuth2 popup flow. Give "pb" its own domain
      # in Coolify and put it here (e.g. https://pb.example.com).
      - PUBLIC_PB_URL=${PUBLIC_PB_URL}
      # Public URL this app is served at — required by SvelteKit for CSRF checks
      - ORIGIN=${ORIGIN}
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - the-network

volumes:
  db-data:
  grafana-storage:

networks:
  the-network:
